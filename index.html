let map, marker, accuracyCircle;
let streetLayer, satelliteLayer;
let currentLayer = 'street';

// Initialize base layers
function initMap(lat, lon, acc) {
  if (!map) {
    map = L.map('map').setView([lat, lon], 16);

    // Street map layer (OpenStreetMap)
    streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Satellite layer (Esri free)
    satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DigitalGlobe'
    });

    // Marker & accuracy circle
    marker = L.marker([lat, lon]).addTo(map).bindPopup("You are here").openPopup();
    accuracyCircle = L.circle([lat, lon], { radius: acc, color: 'blue', fillColor: '#blue', fillOpacity: 0.2 }).addTo(map);
  } else {
    // Update marker & circle
    marker.setLatLng([lat, lon]).bindPopup("You are here").openPopup();
    accuracyCircle.setLatLng([lat, lon]).setRadius(acc);
    map.setView([lat, lon], 16);
  }
}



// Toggle between street & satellite
function toggleSatellite() {

  if (!map) return;
  if (currentLayer === 'street') {
    map.removeLayer(streetLayer);
    satelliteLayer.addTo(map);
    currentLayer = 'satellite';
  } else {
    map.removeLayer(satelliteLayer);
    streetLayer.addTo(map);
    currentLayer = 'street';
  }
}


// Get user location
function getLocation() {

  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!navigator.geolocation) {
    status.innerText = "Geolocation not supported.";
    return;
  }

  status.innerText = "Requesting location...";

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const acc = pos.coords.accuracy.toFixed(2);
      const time = new Date(pos.timestamp).toLocaleTimeString();

      status.innerText = "Location received ✅";
      result.innerHTML = `
        <strong>Latitude:</strong> ${lat.toFixed(7)} <br>
        <strong>Longitude:</strong> ${lon.toFixed(7)} <br>
        <strong>Accuracy:</strong> ±${acc} meters <br>
        <strong>Time:</strong> ${time} <br>
        <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">Open in Google Maps</a>
      `;



let travel = ` ${lat.toFixed(7)} $ ${lon.toFixed(7)} $ ${acc} ` ;

let nonfixed = ` ${lat} $$ ${lon}  $$ ${acc}`;

let rdata = `${travel} @@@@ ${nonfixed}`;

      })
      .catch(err => console.log(err));






      initMap(lat, lon, acc);
    },
    (err) => {
      switch(err.code) {
        case err.PERMISSION_DENIED: status.innerText = "User denied access ❌"; 
        break;
        case err.POSITION_UNAVAILABLE: status.innerText = "Location unavailable"; break;
        case err.TIMEOUT: status.innerText = "Request timed out ⏰"; break;
        default: status.innerText = "Error: " + err.message;
      }
    },
    { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
  );
}
